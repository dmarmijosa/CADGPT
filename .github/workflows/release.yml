name: Build draft alpha release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0-alpha.1)
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm test
  agent:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./agent pyinstaller==6.19.0
      - run: python -m unittest discover -s agent/tests -v
      - run: python packaging/build.py
      # Inno Setup ships on the windows-2022 image, but install defensively so a
      # runner-image change never breaks the release build.
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows.iss'
      - if: matrix.platform == 'linux'
        run: tar -czf dist/CADGPT-linux-x64.tar.gz -C dist CADGPT
      - if: matrix.platform == 'macos'
        run: hdiutil create -volname "CAD Agent Designer" -srcfolder dist/CADGPT.app -ov -format UDZO dist/CADGPT-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cadgpt-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/CADGPT-Setup-*.exe
            dist/CADGPT-*.dmg
            dist/CADGPT-*.tar.gz
          if-no-files-found: error
  draft:
    needs: agent
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cadgpt-*
          merge-multiple: true
          path: artifacts
      - name: Checksums
        run: cd artifacts && sha256sum CADGPT-* > SHA256SUMS.txt
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "CAD Agent Designer $TAG — unsigned alpha" --notes "FreeCAD and AutoCAD 2026 Core Console full 13-op parity (create/boolean/transform/read_scene/export); file-permissions allowlist with safe open-by-path and backup/save-back; redesigned Stitch dashboard; backend deployment and an OAuth client are required; unsigned/unnotarized alpha — read the README compatibility and security sections."
