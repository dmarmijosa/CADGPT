name: Build alpha release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.1.0-alpha.1)
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build && npm test
  agent:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x64
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-15
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ./agent pyinstaller==6.19.0
      - if: matrix.platform == 'linux'
        run: xvfb-run -a python -m unittest discover -s agent/tests -v
      - if: matrix.platform != 'linux'
        run: python -m unittest discover -s agent/tests -v
      # WiX v4 and Inno Setup for Windows
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - run: python packaging/build.py
      - if: matrix.platform == 'linux'
        run: |
          tar -czf dist/CADEngine-linux-x64.tar.gz -C dist cadengine
          cp dist/CADEngine-linux-x64.tar.gz dist/CADGPT-linux-x64.tar.gz
      - if: matrix.platform == 'macos'
        run: |
          hdiutil create -volname "CAD Engine" -srcfolder dist/cadengine.app -ov -format UDZO dist/CADEngine-macos-${{ matrix.arch }}.dmg
          cp dist/CADEngine-macos-${{ matrix.arch }}.dmg dist/CADGPT-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cadengine-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.msi
            dist/*.exe
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error
  release:
    needs: agent
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cadengine-*
          merge-multiple: true
          path: artifacts
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* --verify-tag --prerelease --title "CAD Engine $TAG — unsigned alpha" --notes "CAD Engine $TAG: Unified CLI and daemons (schtasks, systemd, launchctl); WiX v4 elevated MSI installer with PATH integration; FreeCAD 1.1.3 advanced modeling (loft, chamfer, fillet, wedge, polygon); Google OAuth2 identity provider with Stitch dark workbench styling."
