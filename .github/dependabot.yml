version: 2
updates:
  # Root npm workspace
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      dependencies:
        patterns:
          - '*'

  # Backend API
  - package-ecosystem: 'npm'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      dependencies:
        patterns:
          - '*'

  # Web frontend
  - package-ecosystem: 'npm'
    directory: '/apps/web'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      dependencies:
        patterns:
          - '*'

  # Python agent daemon
  - package-ecosystem: 'pip'
    directory: '/agent'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'build(deps)'
    groups:
      dependencies:
        patterns:
          - '*'

  # GitHub Actions CI/CD workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns:
          - '*'
