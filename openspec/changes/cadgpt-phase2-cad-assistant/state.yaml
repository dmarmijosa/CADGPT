slice_8_notes:
  - "StlViewer's `mesh` input carries an already-fetched `ArrayBuffer`, not `meshUrl` as tasks.md's wording suggested — `GET /api/designs/:id/mesh` requires an owner bearer token that a plain `STLLoader.load(url)` call cannot attach, so `design-detail` fetches the bytes via `ApiService.requestArrayBuffer()` and passes them in."
  - "`SCENE_FACTORY` DI token (features/viewer/scene-factory.ts) is the test seam instead of module-level mocking of `three-scene.ts`; its default implementation lazy-imports `three-scene.ts`, the only module that imports `three`/its addons."
  - "Production build confirms `three` lands in its own lazy chunk (`three-scene`, 567.88 kB raw / 117.49 kB transfer), separate from `main` and from the `design-detail` route chunk (3.83 kB)."
  - "492 authored lines (package-lock.json's 65-line churn excluded), within the 600-line budget — no size:exception needed for slice 8."
