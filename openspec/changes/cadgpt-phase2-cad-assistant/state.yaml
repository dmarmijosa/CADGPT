updated: 2026-09-14
slice_11_notes:
  - "`Store.jobs()`'s SELECT now projects `COALESCE(type,'create_box') AS type` and `document_id AS documentId`, so `Job.type`/`Job.documentId` in `models.ts` moved from optional to required — the API now actually sends both, closing the gap slice 10 flagged."
  - "`jobResultSummary()` in `jobs.ts` mirrors `apps/api/src/tools.ts`'s `parseJobResult`: JSON `{message, scene?}` renders only `message`, truncated to ~140 chars with the full text in `title`; `scene` is never rendered on this page."
  - "Status badge uses one dynamic `[class]` bound to the raw status string instead of one `[class.x]` per value, so `queued/running/succeeded/failed/expired/unknown/cancelled` are all covered without new CSS — `.status`'s existing muted base style covers any value without a dedicated color token, and status text is always shown alongside the class."
  - "442 authored lines against the 600-line budget — no size:exception needed for slice 11."
openspec_mirrored_at: 2026-09-14
slice_8_notes:
  - "StlViewer's `mesh` input carries an already-fetched `ArrayBuffer`, not `meshUrl` as tasks.md's wording suggested — `GET /api/designs/:id/mesh` requires an owner bearer token that a plain `STLLoader.load(url)` call cannot attach, so `design-detail` fetches the bytes via `ApiService.requestArrayBuffer()` and passes them in."
  - "`SCENE_FACTORY` DI token (features/viewer/scene-factory.ts) is the test seam instead of module-level mocking of `three-scene.ts`; its default implementation lazy-imports `three-scene.ts`, the only module that imports `three`/its addons."
  - "Production build confirms `three` lands in its own lazy chunk (`three-scene`, 567.88 kB raw / 117.49 kB transfer), separate from `main` and from the `design-detail` route chunk (3.83 kB)."
  - "492 authored lines (package-lock.json's 65-line churn excluded), within the 600-line budget — no size:exception needed for slice 8."
slice_9_notes:
  - "Design tokens (:root custom properties in styles.css) retint every existing shared class (button/.quiet/.panel/.status/.eyebrow/.message/.cad/.job/inputs), so devices/designs/jobs/connect/pair/design-detail all pick up the new palette with zero markup changes beyond one status-badge class alignment in jobs.html."
  - "The shared `.eyebrow` class itself is fixed (text-transform: lowercase + ::first-letter uppercase) instead of editing each page's all-caps literal text — satisfies 'no all-caps eyebrows' app-wide without touching devices/designs/jobs/pair/connect/design-detail markup."
  - "`Shell` is the static app root in production (`app.ts` renders `<app-shell/>`), not a routed component, so `shell.spec.ts` wraps the real `app.routes.ts` route table under a test-only `{ path: '', component: Shell, children: routes }` config for RouterTestingHarness — no production routing change."
  - "729 authored lines against the 600-line budget (~21% over), after dropping a non-essential `.button-link` class and an unused `h3` rule; size:exception requested, consistent with slices 2b/4b/7's already-accepted precedent in this same change."
slice_10_notes:
  - "New `core/api/models.ts` + `core/api/api-client.ts` wrap `ApiService`: `Device`/`Job`/`Design`/`DesignDetail` DTOs match the server's actual camelCase JSON exactly (`store.ts`'s `devices()`/`jobs()`/`listDocuments()` already alias to camelCase in SQL). `Job.type`/`documentId` are optional — the `jobs` table has both columns since slice 1, but `Store.jobs()`'s SELECT does not project them yet (slice 11 extends that query), so the DTO does not invent data the API does not send today. `Cad.capabilities` is optional for the same forward-compat reason (D14/D16 add it in a later slice)."
  - "`WorkspaceStore` uses one `resource()` per collection (D16); `resource().value()` throws while a resource is in its error state with no prior successful load, so `onlineDevices`/`designsWithPreview` and both pages' template conditionals gate every `.value()` read behind `.hasValue()` — an `?? []` fallback does not catch the throw."
  - "Devices/designs pages moved from the old `.panel`-per-row layout to `table.data` (slice 9's shared class) with `scope=\"col\"` headers; devices revoke uses an inline per-row confirm/cancel state instead of `window.confirm`; the 'create a test box' form on the designs page moved into a collapsed native `<details>` panel."
  - "Deliverable 6 (wire `design-detail` to `ApiClient`) was left as `ApiService` per the task's own 'if trivial; otherwise leave' clause once the projected diff crossed the review budget — the page's behavior and its existing tests are unchanged."
  - "877 authored lines against the 600-line budget (~46% over) — a `WorkspaceStore`+`ApiClient`/`models` architecture layer plus two full page-and-test rewrites did not fit the ~240-450 estimate without cutting tests or comments; size:exception requested, consistent with slices 2b/4b/7/9's already-accepted precedent in this same change."
