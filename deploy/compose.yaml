# Development only. Set a unique bootstrap password before launch.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set a unique local bootstrap password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./cadgpt-realm.json:/opt/keycloak/data/import/cadgpt-realm.json:ro
      - ./themes:/opt/keycloak/themes:ro
      - keycloak-data:/opt/keycloak/data
volumes:
  keycloak-data:
