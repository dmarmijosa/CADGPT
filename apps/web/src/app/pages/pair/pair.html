<section class="panel">
  <p class="eyebrow">LINK A COMPUTER</p>
  <h1>Pair your device</h1>
  <p>
    Only enter a code from an agent you installed on a computer you control. Codes expire after 10
    minutes.
  </p>
  @if (error()) {
    <div class="message error" role="alert">{{ error() }}</div>
  }
  @if (notice()) {
    <div class="message" role="status">{{ notice() }}</div>
  }
  <form (submit)="$event.preventDefault(); approve()">
    <label for="code">12-character pairing code</label>
    <input id="code" autocomplete="off" placeholder="A1B2C3D4E5F6" [formField]="fields.code" />
    <button type="submit" [disabled]="busy() || model().code.trim().length !== 12">
      Confirm &amp; link device
    </button>
  </form>
  <p><a routerLink="/connect">Next: connect an MCP client →</a></p>
</section>
