<section class="panel">
  <p class="eyebrow">{{ 'pair.eyebrow' | translate }}</p>
  <h1>{{ 'pair.title' | translate }}</h1>
  <p>
    {{ 'pair.desc' | translate }}
  </p>
  @if (error()) {
    <div class="message error" role="alert">{{ error() }}</div>
  }
  <form (submit)="$event.preventDefault(); approve()">
    <label for="code">{{ 'pair.code_label' | translate }}</label>
    <input
      id="code"
      autocomplete="off"
      [placeholder]="'pair.code_placeholder' | translate"
      [formField]="fields.code"
    />
    <button type="submit" [disabled]="busy() || model().code.trim().length !== 12">
      {{ 'pair.confirm_btn' | translate }}
    </button>
  </form>
</section>
