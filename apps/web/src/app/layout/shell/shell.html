<a class="skip-link" href="#main-content">Skip to content</a>
<header>
  <a class="brand" routerLink="/">
    <span class="mark" aria-hidden="true">
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 20 L4 4 L14 4 L20 10 L20 20 Z" />
        <path d="M14 4 L14 10 L20 10" />
      </svg>
    </span>
    CADGPT
  </a>
  <nav aria-label="Account">
    @if (auth.user(); as user) {
      <span>{{ user.profile.preferred_username ?? 'Your account' }}</span>
      <button class="quiet" type="button" (click)="signOut()">Sign out</button>
    } @else {
      <button type="button" (click)="signIn()">Sign in</button>
    }
  </nav>
</header>
<div class="shell">
  <nav class="rail" aria-label="Primary">
    <a routerLink="/devices" routerLinkActive="active" ariaCurrentWhenActive="page">Devices</a>
    <a routerLink="/designs" routerLinkActive="active" ariaCurrentWhenActive="page">Designs</a>
    <a routerLink="/jobs" routerLinkActive="active" ariaCurrentWhenActive="page">Jobs</a>
    <a routerLink="/connect" routerLinkActive="active" ariaCurrentWhenActive="page">Connect</a>
    <div class="rail-secondary">
      <a routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">About</a>
    </div>
  </nav>
  <main id="main-content">
    <router-outlet />
  </main>
</div>
<footer>
  <span>CADGPT — experimental alpha</span>
  <span>FreeCAD execution, AutoCAD discovery, and remote MCP.</span>
</footer>
