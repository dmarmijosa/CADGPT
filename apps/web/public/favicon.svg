<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#00c2cf"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="30" height="30" x="1" y="1" rx="6" fill="none" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1"/>

  <!-- 3D Isometric CAD Cube -->
  <polygon points="16,6.5 24.5,11.2 16,15.8 7.5,11.2" fill="url(#top)" fill-opacity="0.95"/>
  <polygon points="7.5,11.2 16,15.8 16,25.5 7.5,20.8" fill="url(#left)" fill-opacity="0.95"/>
  <polygon points="16,15.8 24.5,11.2 24.5,20.8 16,25.5" fill="url(#right)" fill-opacity="0.95"/>

  <!-- Precision wireframe edges -->
  <polyline points="7.5,11.2 16,6.5 24.5,11.2 24.5,20.8 16,25.5 7.5,20.8 7.5,11.2" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-linejoin="round"/>
  <line x1="16" y1="15.8" x2="16" y2="25.5" stroke="#00f0ff" stroke-width="1.2"/>
  <line x1="16" y1="15.8" x2="7.5" y2="11.2" stroke="#00f0ff" stroke-width="1.2"/>
  <line x1="16" y1="15.8" x2="24.5" y2="11.2" stroke="#00f0ff" stroke-width="1.2"/>

  <!-- Center vertex crosshair / drafting point -->
  <circle cx="16" cy="15.8" r="1.2" fill="#ffffff"/>
</svg>
